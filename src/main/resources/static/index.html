<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgendaPersonal</title>

<link rel="stylesheet" href="css/estilos.css">
</head>
<body>

	<!-- AUTENTICACIÓN -->
	<section id="pantallaAutenticacion" class="pantalla-auth">
		<div class="auth-contenedor">

			<div class="marca">
				<span class="marca-icono">A</span> <span>AgendaPersonal</span>
			</div>

			<!-- INICIAR SESIÓN -->
			<form id="formLogin" class="form-auth">
				<h1>Tu agenda, a mano</h1>
				<p class="texto-secundario">Inicia sesión en AgendaPersonal.</p>

				<label for="loginCorreo">Correo electrónico</label> <input
					type="email" id="loginCorreo" name="correo"
					placeholder="tu@correo.com" required> <label
					for="loginContrasena">Contraseña</label> <input type="password"
					id="loginContrasena" name="contrasena"
					placeholder="Introduce tu contraseña" required>

				<p id="errorLogin" class="mensaje-error"></p>

				<button type="submit" class="btn-principal btn-ancho">
					Iniciar sesión</button>

				<p class="texto-enlace">
					¿No tienes cuenta?
					<button type="button" class="btn-enlace" id="mostrarRegistro">
						Crear cuenta</button>
				</p>
			</form>

			<!-- REGISTRO -->
			<form id="formRegistro" class="form-auth oculto">
				<h1>Crea tu cuenta</h1>
				<p class="texto-secundario">Un espacio sencillo para organizar
					tu día.</p>

				<label for="registroNombre">Nombre</label> <input type="text"
					id="registroNombre" name="nombre" placeholder="Tu nombre"
					maxlength="100" required> <label for="registroApellidos">Apellidos</label>
				<input type="text" id="registroApellidos" name="apellidos"
					placeholder="Tus apellidos" maxlength="150" required> <label
					for="registroCorreo">Correo electrónico</label> <input type="email"
					id="registroCorreo" name="correo" placeholder="tu@correo.com"
					maxlength="254" required> <label for="registroContrasena">Contraseña</label>
				<input type="password" id="registroContrasena" name="contrasena"
					placeholder="Mínimo 8 caracteres" minlength="8" maxlength="72"
					required> <label for="registroConfirmacion">Confirmar
					contraseña</label> <input type="password" id="registroConfirmacion"
					placeholder="Repite tu contraseña" minlength="8" required>

				<p id="errorRegistro" class="mensaje-error"></p>

				<button type="submit" class="btn-principal btn-ancho">
					Crear cuenta</button>

				<p class="texto-enlace">
					¿Ya tienes cuenta?
					<button type="button" class="btn-enlace" id="mostrarLogin">
						Iniciar sesión</button>
				</p>
			</form>

		</div>
	</section>

	<!-- APLICACIÓN -->
	<div id="aplicacion" class="app oculto">

		<aside class="sidebar">
			<div class="sidebar-marca">
				<span class="marca-icono">A</span> <span>AgendaPersonal</span>
			</div>

			<button id="btnCrear" class="btn-crear">
				<span>＋</span> Crear
			</button>

			<nav class="navegacion">
				<button class="nav-item activo" data-vista="inicio">
					<span>⌂</span> Inicio
				</button>

				<button class="nav-item" data-vista="calendario">
					<span>▦</span> Calendario
				</button>

				<button class="nav-item" data-vista="contactos">
					<span>♙</span> Contactos
				</button>

				<button class="nav-item" data-vista="recordatorios">
					<span>♧</span> Recordatorios
				</button>
			</nav>

			<div class="sidebar-usuario">
				<div class="avatar" id="avatarUsuario">U</div>

				<div class="usuario-info">
					<span id="nombreUsuario">Usuario</span>
					<button id="btnCerrarSesion" class="btn-cerrar-sesion">
						Cerrar sesión</button>
				</div>
			</div>
		</aside>

		<main class="contenido-app">
			<header class="barra-superior">
				<h2 id="tituloVista">Inicio</h2>

				<div class="barra-acciones">
					<input type="search" id="buscador"
						placeholder="Buscar en tu agenda">
				</div>
			</header>

			<section id="contenidoVista" class="contenido-vista">
				<!-- El contenido de cada sección se cargará aquí -->
			</section>
		</main>
	</div>

	<script src="/js/api.js"></script>
	<script src="/js/eventos.js"></script>
	<script src="/js/calendario.js"></script>
	<script src="/js/autenticacion.js"></script>
	<script src="/js/contactos.js"></script>
	<script src="/js/recordatorios.js"></script>
	<script src="/js/notificaciones.js"></script>
	<script src="/js/inicio.js"></script>
	<script src="/js/app.js"></script>
</body>
</html>
